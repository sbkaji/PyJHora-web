<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Protector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        .hidden-detector {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            display: none;
            z-index: 9999;
        }
        
        .debug-info.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="hidden-detector" id="protector-detector">FiveM Protector Active</div>
    
    <div class="debug-info" id="debug-info">
        <div>FiveM Protector NUI</div>
        <div id="status">Status: Loading...</div>
        <div id="timestamp">Time: --</div>
    </div>

    <script>
        // Global variables
        let protectorActive = true;
        let devToolsDetected = false;
        let debugMode = false;
        let detectionCount = 0;
        
        // Debug info element
        const debugInfo = document.getElementById('debug-info');
        const statusElement = document.getElementById('status');
        const timestampElement = document.getElementById('timestamp');
        
        // Update debug info
        function updateDebugInfo(status) {
            if (debugMode) {
                statusElement.textContent = `Status: ${status}`;
                timestampElement.textContent = `Time: ${new Date().toLocaleTimeString()}`;
                debugInfo.classList.add('show');
            }
        }
        
        // Send message to game
        function sendToGame(type, data = {}) {
            const payload = {
                type: type,
                data: data,
                timestamp: Date.now(),
                detectionCount: detectionCount
            };
            
            // Try multiple methods to ensure delivery
            try {
                // Method 1: Standard fetch
                fetch(`https://${GetParentResourceName()}/nui_callback`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                }).catch(() => {
                    // Method 2: Alternative resource name
                    fetch('https://leo-anticheat/nui_callback', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    }).catch(console.error);
                });
            } catch (e) {
                console.error('Failed to send to game:', e);
            }
        }
        
        // Get resource name safely
        function GetParentResourceName() {
            try {
                return window.invokeNative ? window.invokeNative('getCurrentResourceName') : 'leo-anticheat';
            } catch (e) {
                return 'leo-anticheat';
            }
        }
        
        // DevTools detection methods
        function detectDevTools() {
            let detected = false;
            
            // Method 1: Console object modification
            try {
                const element = new Image();
                Object.defineProperty(element, 'id', {
                    get: function() {
                        detected = true;
                        throw new Error('DevTools detected');
                    }
                });
                console.log(element);
                console.clear && console.clear();
            } catch (e) {
                detected = true;
            }
            
            // Method 2: Timing-based detection
            const start = performance.now();
            debugger; // This will pause if DevTools are open
            const end = performance.now();
            
            if (end - start > 100) {
                detected = true;
            }
            
            // Method 3: Size-based detection
            const threshold = 160;
            if (window.outerHeight - window.innerHeight > threshold || 
                window.outerWidth - window.innerWidth > threshold) {
                detected = true;
            }
            
            return detected;
        }
        
        // Anti-tamper protection
        function protectCode() {
            // Prevent common bypass methods
            const originalConsole = window.console;
            
            // Protect console
            Object.defineProperty(window, 'console', {
                get: function() {
                    detectionCount++;
                    return originalConsole;
                },
                set: function() {
                    detectionCount++;
                }
            });
            
            // Prevent script modification
            const scripts = document.getElementsByTagName('script');
            for (let script of scripts) {
                Object.freeze(script);
            }
        }
        
        // Main detection loop
        function startDetection() {
            setInterval(() => {
                if (!protectorActive) return;
                
                try {
                    const detected = detectDevTools();
                    
                    if (detected && !devToolsDetected) {
                        devToolsDetected = true;
                        detectionCount++;
                        updateDebugInfo('DevTools Detected!');
                        sendToGame('devtools_detected', {
                            method: 'multiple_methods',
                            userAgent: navigator.userAgent,
                            screen: {
                                width: screen.width,
                                height: screen.height
                            }
                        });
                    }
                } catch (e) {
                    // Detection error might indicate tampering
                    sendToGame('detection_error', { error: e.message });
                }
            }, 1000);
        }
        
        // Initialize protection
        function initialize() {
            updateDebugInfo('Initializing...');
            protectCode();
            startDetection();
            updateDebugInfo('Active');
            
            // Send ready signal to game
            sendToGame('nui_ready', {
                ready: true,
                userAgent: navigator.userAgent
            });
        }
        
        // Message handler from game
        window.addEventListener('message', function(event) {
            const data = event.data;
            
            switch(data.type) {
                case 'test_connection':
                    updateDebugInfo('Test received');
                    sendToGame('test_response', {
                        message: 'NUI is working correctly',
                        received: data.message
                    });
                    break;
                    
                case 'enable_debug':
                    debugMode = true;
                    updateDebugInfo('Debug enabled');
                    break;
                    
                case 'disable_debug':
                    debugMode = false;
                    debugInfo.classList.remove('show');
                    break;
                    
                case 'devtools_check':
                    const currentlyDetected = detectDevTools();
                    sendToGame('devtools_status', {
                        detected: currentlyDetected,
                        detectionCount: detectionCount
                    });
                    break;
                    
                case 'ping':
                    sendToGame('pong', { timestamp: Date.now() });
                    break;
            }
        });
        
        // Prevent common exploit methods
        document.addEventListener('keydown', function(e) {
            // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) ||
                (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                detectionCount++;
                sendToGame('keyboard_block', { key: e.keyCode });
                return false;
            }
        });
        
        // Prevent right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            detectionCount++;
            sendToGame('context_menu_block', {});
            return false;
        });
        
        // Start when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
        
        // Heartbeat to ensure NUI is responsive
        setInterval(() => {
            if (protectorActive) {
                sendToGame('heartbeat', {
                    active: true,
                    detectionCount: detectionCount,
                    timestamp: Date.now()
                });
            }
        }, 5000);
        
        console.log('FiveM Protector NUI loaded successfully');
    </script>
</body>
</html>
